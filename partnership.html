<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnership Onward</title>
<style>
:root{
 color-scheme: light;
 --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f4f3f0;
 --ink-1:#0b0b0b; --ink-2:#52514e; --muted:#898781;
 --grid:#e1e0d9; --border:rgba(11,11,11,0.10); --chip-bg:#f0efec;
 --accent:#2a78d6; --accent-soft:#cde2fb; --accent-dark:#1c5cab;
 --mark-bg:#fde9b8; --shadow:0 2px 10px rgba(0,0,0,0.08);
 --s-firm:#0f8f7a; --s-bozza:#2a78d6; --s-disc:#c08a1e; --s-dorm:#898781; --s-out:#b5462f;
 --p-rete:#1f6f5c; --p-canale:#2a5fa8; --p-esplorazione:#7a4fb5; --p-clienti:#a8761a; --p-fuori:#8a8782;
 --ring:#9b9a94; --ring-lab:#52514e;
 --onw:#d2601f;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  color-scheme: dark;
  --page:#0d0d0d; --surface:#161615; --surface-2:#1e1e1c;
  --ink-1:#f2f1ee; --ink-2:#b9b7b1; --muted:#8b8983;
  --grid:#2c2c29; --border:rgba(255,255,255,0.12); --chip-bg:#232321;
  --accent:#6ba8ea; --accent-soft:#1d3a5c; --accent-dark:#9cc6f4;
  --mark-bg:#5b4a17; --shadow:0 2px 12px rgba(0,0,0,0.5);
  --s-firm:#3fbfa6; --s-bozza:#6ba8ea; --s-disc:#e0b44e; --s-dorm:#9b9993; --s-out:#e08063;
  --p-rete:#3fa98f; --p-canale:#6197e0; --p-esplorazione:#ab8adb; --p-clienti:#d4a44c; --p-fuori:#a7a49e;
  --ring:#565651; --ring-lab:#b9b7b1;
  --onw:#f08a45;
 }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink-1);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}

/* gate */
#gate{position:fixed;inset:0;background:var(--page);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#gate .box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;box-shadow:var(--shadow)}
#gate h1{font-size:19px;margin:0 0 4px}
#gate p{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
#gate input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--ink-1)}
#gate button{margin-top:12px;width:100%;padding:11px;font-size:15px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
#gate .err{color:#b5462f;font-size:13px;min-height:18px;margin-top:8px}
#gate .rem{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
#gate .rem input{width:auto;margin:0;accent-color:var(--accent)}

header.top{border-bottom:1px solid var(--grid);background:var(--surface);position:sticky;top:0;z-index:20}
header.top .in{max-width:1120px;margin:0 auto;padding:14px 16px 0}
h1.title{font-size:21px;margin:0 0 2px;letter-spacing:-0.2px}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 12px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-family:inherit}
nav.tabs button.on{color:var(--ink-1);border-bottom-color:var(--accent);font-weight:600}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.bar input[type=search]{flex:1 1 220px;min-width:160px;padding:8px 11px;font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink-1);font-family:inherit}
.bar select{padding:8px 10px;font-size:13.5px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink-1);font-family:inherit}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:14px 0 6px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
.kpi b{display:block;font-size:24px;line-height:1.1;letter-spacing:-0.5px}
.kpi span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:3px}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);background:var(--chip-bg);border-radius:999px;padding:3px 10px;cursor:pointer;border:1px solid transparent}
.lg.off{opacity:.38}
.lg i{width:9px;height:9px;border-radius:50%;display:inline-block}

.mapbox{background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-top:10px;overflow:hidden}
.mapscroll{overflow-x:auto}
svg.map{display:block;width:100%;min-width:700px;height:auto}
svg.map text{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
svg.map .nd{cursor:pointer}
svg.map .nd circle{transition:r .12s}
svg.map .nd:hover circle{stroke-width:3}
.maphint{padding:9px 14px;border-top:1px solid var(--grid);color:var(--muted);font-size:12.5px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:14px}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.col h3 i{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:14.5px;margin-bottom:2px}
.card p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.card .meta{margin-top:6px;font-size:11.5px;color:var(--muted)}

.grp{margin-top:22px}
.grp>h2{font-size:16px;margin:0 0 2px}
.grp>p.n{margin:0 0 10px;color:var(--ink-2);font-size:13px}

details.sch{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-bottom:9px;overflow:hidden}
details.sch>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
details.sch>summary::-webkit-details-marker{display:none}
details.sch>summary strong{font-size:15.5px}
details.sch[open]>summary{border-bottom:1px solid var(--grid);background:var(--surface-2)}
.body{padding:12px 14px 16px}
.f{margin:0 0 11px}
.f dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
.f dd{margin:0;font-size:14px;color:var(--ink-1)}
.prg{background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--onw);border-radius:10px;padding:11px 13px;margin:0 0 13px}
.prg .tt{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
.prg .sb{font-size:12px;color:var(--muted);margin:0 0 9px}
.prg ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prg li{display:flex;gap:9px;font-size:14px;line-height:1.42;color:var(--ink-1)}
.prg li .n{flex:0 0 auto;width:19px;height:19px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.prg .no{font-size:14px;color:var(--ink-2)}
.f ul{margin:2px 0 0;padding-left:19px}
.f li{margin-bottom:3px}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--chip-bg);color:var(--ink-2);margin:0 4px 4px 0;border:1px solid var(--border)}
.pill.st{color:#fff;border:0}
.q{background:var(--mark-bg);padding:1px 3px;border-radius:3px}
.src{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--grid);padding:2px 0 2px 10px;margin-bottom:7px}
.src code{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.src a.reclink{display:inline-block;text-decoration:none;color:var(--accent);margin-top:3px}
.src a.reclink:hover{text-decoration:underline}
.src a.reclink code{color:inherit}
#tip{position:fixed;z-index:60;pointer-events:none;max-width:270px;background:var(--surface);color:var(--ink-1);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:9px 11px;font-size:12.5px;line-height:1.38;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip b{display:block;font-size:13.5px;margin-bottom:3px}
#tip .r{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .r i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
#tip .k{color:var(--muted);margin-top:5px;font-size:11.5px}

.prose h2{font-size:17px;margin:22px 0 5px}
.prose p{margin:0 0 12px;font-size:15px;color:var(--ink-1);max-width:74ch}

#panel{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:40;padding:16px}
#panel.on{display:flex;align-items:flex-start;justify-content:center}
#panel .sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow);margin-top:3vh}
#panel .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--grid);position:sticky;top:0;background:var(--surface)}
#panel .hd h3{margin:0;font-size:17px}
#panel .x{background:var(--chip-bg);border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--ink-1);font-family:inherit}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--grid);color:var(--muted);font-size:12.5px}
.hide{display:none!important}
@media (max-width:560px){ .kpi b{font-size:20px} h1.title{font-size:18px} }
</style>
</head>

var STCOL={"accordo firmato":"--s-firm","bozza in negoziazione":"--s-bozza","accordo discusso":"--s-disc","rapporto dormiente":"--s-dorm","uscito dalla rete":"--s-out"};
var STORD=["accordo firmato","bozza in negoziazione","accordo discusso","rapporto dormiente","uscito dalla rete"];
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888";}
function stcol(s){return cv(STCOL[s]||"--s-dorm");}
function pcol(i){return cv("--p-"+i);}
function perNome(i){var x=(D.perimetri||[]).filter(function(z){return z.id===i;})[0];return x?x.nome:i;}
function nProg(p){var n=(p.progetti||[]).length;return n===0?"nessun fronte di lavoro":(n===1?"1 fronte di lavoro":n+" fronti di lavoro");}
function titProg(p){var n=(p.progetti||[]).length;return n===0?"Nessun fronte di lavoro":(n===1?"Il fronte di lavoro":"I "+n+" fronti di lavoro");}
function progHtml(p){var l=p.progetti||[],c=pcol(p.perimetro);
 var h='<div class="prg" style="border-left-color:'+c+'"><div class="tt">'+esc(titProg(p))+'</div>';
 if(l.length) h+='<div class="sb">Progetti avviati, ipotesi di lavoro, tavoli e occasioni concrete.</div>';
 h+= l.length ? '<ol>'+l.map(function(x,i){return '<li><span class="n" style="background:'+c+'">'+(i+1)+'</span><span>'+esc(x)+'</span></li>';}).join("")+'</ol>'
  : '<div class="no">In archivio non risulta aperto nessun fronte di lavoro con questo soggetto.</div>';
 return h+'</div>';}
function tipEl(){var t=document.getElementById("tip");if(!t){t=document.createElement("div");t.id="tip";document.body.appendChild(t);}return t;}
function moveTip(ev){var t=tipEl();var x=ev.clientX+15,y=ev.clientY+15,w=t.offsetWidth||230,h=t.offsetHeight||96;
 if(x+w>window.innerWidth-8)x=Math.max(8,ev.clientX-w-15);
 if(y+h>window.innerHeight-8)y=Math.max(8,ev.clientY-h-15);
 t.style.left=x+"px";t.style.top=y+"px";}
function hideTip(){var t=document.getElementById("tip");if(t)t.classList.remove("on");}
function showTip(ev,p,col){var t=tipEl(),si=STORD.indexOf(p.stato)+1;
 t.innerHTML='<b>'+esc(p.nome)+'</b><div class="r"><i style="background:'+col+'"></i>'+esc(perNome(p.perimetro))+'</div>'+
  '<div class="r">'+esc(p.stato)+(si>0?' (anello '+si+')':'')+'</div>'+
  '<div class="r">'+esc(nProg(p))+'</div>'+

 t.classList.add("on");moveTip(ev);}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function b64bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
var LSK="arch_key";
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function bytesB64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}

async function keyFromPass(pass){
 var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
 var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64bytes(SALT),iterations:ITER,hash:"SHA-256"},base,256);
 return new Uint8Array(bits);
}
async function openWith(kb){
 var key=await crypto.subtle.importKey("raw",kb,{name:"AES-GCM"},false,["decrypt"]);
 var raw=b64bytes(PAYLOAD);
 var pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},key,raw.slice(12)));
 var ds=new DecompressionStream("gzip"); var w=ds.writable.getWriter(); w.write(pt); w.close();
 var txt=await new Response(ds.readable).text();
 return JSON.parse(txt);
}
function opened(){
 document.getElementById("gate").classList.add("hide");
 document.getElementById("app").classList.remove("hide");
 boot();
}

async function start(){
 var e=document.getElementById("err"); e.textContent="Apertura in corso...";
 try{ var kb=await keyFromPass(document.getElementById("pw").value);
  D=await openWith(kb);
  var r=document.getElementById("rem");
  if(r&&r.checked) lsSet(LSK,bytesB64(kb)); else lsDel(LSK);
  document.getElementById("pw").value="";
  opened();
 }catch(x){ e.textContent="Passphrase non valida."; }
}

})();

var TABS=[["mappa","Mappa"],["stato","Per stato"],["practice","Per practice"],["schede","Schede"],["sintesi","Che cosa non torna"]];
var cur="mappa", flt={q:"",st:null,pe:""};

function boot(){
 var n=D.partner.length;
 var firm=D.partner.filter(function(p){return p.stato==="accordo firmato";}).length;
 document.getElementById("subline").textContent=n+" soggetti censiti, "+firm+" con un documento sottoscritto. Fotografia al "+D.meta.data+", ricavata dall'archivio ("+D.meta.fonti+" citazioni verificate).";
 var t=document.getElementById("tabs"); t.innerHTML="";
 TABS.forEach(function(x){var b=document.createElement("button");b.textContent=x[1];b.dataset.k=x[0];b.onclick=function(){cur=x[0];render();};t.appendChild(b);});
 document.getElementById("px").onclick=function(){document.getElementById("panel").classList.remove("on");};
 var la=document.getElementById("lockA");
 if(la) la.onclick=function(ev){ev.preventDefault();lsDel(LSK);location.reload();};
 document.getElementById("panel").onclick=function(ev){if(ev.target.id==="panel")this.classList.remove("on");};
 render();
}

function match(p){
 if(flt.st&&p.stato!==flt.st)return false;
 if(flt.pe&&p.perimetro!==flt.pe)return false;
 if(!flt.q)return true;
 var q=flt.q.toLowerCase();
 return JSON.stringify(p).toLowerCase().indexOf(q)>=0;
}

function render(){
 Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.k===cur);});
 var v=document.getElementById("view"); v.innerHTML="";
 if(cur==="mappa") v.appendChild(viewMappa());
 else if(cur==="stato") v.appendChild(viewStato());
 else if(cur==="practice") v.appendChild(viewPractice());
 else if(cur==="schede") v.appendChild(viewSchede());
 else v.appendChild(viewSintesi());
 var f=document.createElement("div"); f.className="foot";
 f.textContent="Archivio unificato Plaud, Claude e Cowork. "+D.meta.nota;
 v.appendChild(f);
 window.scrollTo(0,0);
}

function legendPer(){
 var d=document.createElement("div"); d.className="legend";
 D.perimetri.forEach(function(pe){
  var n=D.partner.filter(function(p){return p.perimetro===pe.id;}).length;
  var e=document.createElement("span"); e.className="lg"+(flt.pe&&flt.pe!==pe.id?" off":"");
  e.innerHTML='<i style="background:'+pcol(pe.id)+'"></i>'+esc(pe.nome)+" ("+n+")";
  e.onclick=function(){flt.pe=(flt.pe===pe.id?null:pe.id);render();};
  d.appendChild(e);
 });
 return d;
}

function legend(){
 var d=document.createElement("div"); d.className="legend";
 STORD.forEach(function(s,si){
  var n=D.partner.filter(function(p){return p.stato===s;}).length;
  var e=document.createElement("span"); e.className="lg"+(flt.st&&flt.st!==s?" off":"");
  e.innerHTML='<b style="color:var(--muted);font-weight:700;margin-right:1px">'+(si+1)+'</b> '+esc(s)+" ("+n+")";
  e.onclick=function(){flt.st=(flt.st===s?null:s);render();};
  d.appendChild(e);
 });
 return d;
}

function kpis(){
 var d=document.createElement("div"); d.className="kpis";
 var P=D.partner;
 var rows=[[P.length,"soggetti"],
  [P.filter(function(p){return p.stato==="accordo firmato";}).length,"firmati"],
  [P.filter(function(p){return p.stato==="bozza in negoziazione";}).length,"in bozza"],
  [P.filter(function(p){return p.stato==="accordo discusso";}).length,"solo discussi"],
  [P.filter(function(p){return p.documento;}).length,"con un documento"],
  [P.reduce(function(a,p){return a+(p.prossimi_passi||[]).length;},0),"passi da fare"],
  [P.reduce(function(a,p){return a+(p.rischi||[]).length;},0),"punti di rischio"]];
 rows.forEach(function(r){var k=document.createElement("div");k.className="kpi";k.innerHTML="<b>"+r[0]+"</b><span>"+r[1]+"</span>";d.appendChild(k);});
 return d;
}

function viewMappa(){
 var f=document.createDocumentFragment();
 f.appendChild(kpis());
 f.appendChild(legendPer());
 f.appendChild(legend());
 var box=document.createElement("div"); box.className="mapbox";
 var sc=document.createElement("div"); sc.className="mapscroll";
 sc.appendChild(buildSvg());
 box.appendChild(sc);
 var h=document.createElement("div"); h.className="maphint";
 h.textContent="Onward al centro. Il colore dice il perimetro, la distanza da Onward dice lo stato dell'accordo: gli accordi firmati sull'anello piu' interno, i rapporti usciti sul bordo. La dimensione del punto dice su quanti fronti si lavora insieme, e il numero esatto compare passando sopra il punto. Un clic apre la scheda, dove ogni fonte porta al contenuto originale in archivio.";
 box.appendChild(h);
 f.appendChild(box);
 return f;
}

var SHORT={"Isododo / QA International":"Isododo / QA Int.","Partner tecnico da individuare":"Partner da individuare","RETE NAZIONALE ITS":"Rete Nazionale ITS"};
function buildSvg(){
 var W=900,H=900,CX=450,CY=450,NS="http://www.w3.org/2000/svg";
 var svg=document.createElementNS(NS,"svg");
 svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("class","map");
 var defs=document.createElementNS(NS,"defs"); svg.appendChild(defs);
 function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
 function txt(x,y,s,o){var e=el("text",{x:x,y:y});for(var k in (o||{}))e.setAttribute(k,o[k]);e.textContent=s;return e;}
 var rad=function(d){return d*Math.PI/180;};
 function pol(r,d){return [CX+r*Math.cos(rad(d)), CY+r*Math.sin(rad(d))];}

 var per=D.perimetri, tot=D.partner.length, gapT=30, gap=6;
 var span=(360-gapT-gap*(per.length-1))/tot;
 var RR=[100,140,178,212,244], R0=54, RL=268, RG=420;
 var a=-90+gapT/2;

 RR.forEach(function(r){
  svg.appendChild(el("circle",{cx:CX,cy:CY,r:r,fill:"none",stroke:cv("--ring"),"stroke-width":1.15,"stroke-dasharray":"4 4"}));
 });

 per.forEach(function(pe,gi){
  var list=D.partner.filter(function(p){return p.perimetro===pe.id;});
  if(!list.length)return;
  var a0=a, a1=a+list.length*span; a=a1+gap;
  var col=pcol(pe.id);
  var mid=(a0+a1)/2, flip=(mid>0&&mid<180);
  var A0=flip?a1:a0, A1=flip?a0:a1, RA=RG+(flip?13:0);
  var p0=pol(RA,A0), p1=pol(RA,A1), pid="arc"+gi;
  defs.appendChild(el("path",{id:pid,d:"M"+p0[0]+","+p0[1]+" A"+RA+","+RA+" 0 0,"+(flip?0:1)+" "+p1[0]+","+p1[1],fill:"none"}));
  var t=el("text",{"font-size":11,"letter-spacing":"1.4","font-weight":700,fill:col});
  var tp=el("textPath",{startOffset:"50%","text-anchor":"middle"});
  tp.setAttribute("href","#"+pid);
  tp.setAttributeNS("http://www.w3.org/1999/xlink","xlink:href","#"+pid);
  tp.textContent=pe.nome.toUpperCase(); t.appendChild(tp); svg.appendChild(t);

  list.forEach(function(p,i){
   var ang=a0+span*(i+0.5);
   var si=STORD.indexOf(p.stato); if(si<0)si=3;
   var rr=RR[si];
   var dim=Math.min(11,6.5+(p.progetti||[]).length*0.8);
   dim=Math.min(dim, rr*span*Math.PI/180*0.46-1.5);
   var on=match(p);
   var c=pol(rr,ang), s0=pol(R0,ang), e0=pol(rr-dim-2,ang);
   svg.appendChild(el("line",{x1:s0[0],y1:s0[1],x2:e0[0],y2:e0[1],stroke:col,"stroke-width":1.2,opacity:on?0.5:0.12}));
   var g0=pol(rr+dim+2,ang), g1=pol(RL-6,ang);
   svg.appendChild(el("line",{x1:g0[0],y1:g0[1],x2:g1[0],y2:g1[1],stroke:cv("--grid"),"stroke-width":1,opacity:on?0.9:0.2}));
   var g=el("g",{class:"nd",opacity:on?1:0.2});
   g.appendChild(el("circle",{cx:c[0],cy:c[1],r:dim,fill:col,stroke:cv("--surface"),"stroke-width":2}));
   var left=(Math.cos(rad(ang))<0);
   var lp=pol(RL,ang);
   var nm=SHORT[p.nome]||p.nome;
   var tt=txt(0,0,nm,{"font-size":12.5,fill:cv("--ink-1"),"text-anchor":left?"end":"start","dominant-baseline":"middle"});
   tt.setAttribute("transform","translate("+lp[0].toFixed(1)+","+lp[1].toFixed(1)+") rotate("+(left?ang+180:ang).toFixed(2)+")");
   g.appendChild(tt);
   g.onclick=function(){openP(p);};
   g.onmouseenter=function(ev){showTip(ev,p,col);};
   g.onmousemove=function(ev){moveTip(ev);};
   g.onmouseleave=hideTip;
   svg.appendChild(g);
  });
 });

 RR.forEach(function(r,i){
  var tl=txt(CX,CY-r,RNAME[STORD[i]]||STORD[i],{"font-size":10,"letter-spacing":"0.3",fill:cv("--ring-lab"),"text-anchor":"middle","dominant-baseline":"middle"});
  tl.setAttribute("stroke",cv("--surface")); tl.setAttribute("stroke-width","3.5");
  tl.setAttribute("paint-order","stroke"); tl.setAttribute("stroke-linejoin","round");
  svg.appendChild(tl);
 });

 svg.appendChild(el("circle",{cx:CX,cy:CY,r:50,fill:cv("--onw"),opacity:0.12}));
 svg.appendChild(el("circle",{cx:CX,cy:CY,r:39,fill:cv("--onw")}));
 svg.appendChild(txt(CX,CY+1,"ONWARD",{"font-size":12.5,"font-weight":700,fill:"#fff","text-anchor":"middle"}));
 svg.appendChild(txt(CX,CY+16,"dal 6.10.2026",{"font-size":9,fill:"#fff","text-anchor":"middle",opacity:0.85}));
 return svg;
}

function viewStato(){
 var f=document.createDocumentFragment();
 f.appendChild(bar());
 var cols=document.createElement("div"); cols.className="cols";
 STORD.forEach(function(s){
  var list=D.partner.filter(function(p){return p.stato===s&&match(p);});
  var c=document.createElement("div"); c.className="col";
  c.innerHTML='<h3><i style="background:'+stcol(s)+'"></i>'+esc(s)+" ("+list.length+")</h3>";
  list.forEach(function(p){ c.appendChild(cardOf(p)); });
  cols.appendChild(c);
 });
 f.appendChild(cols);
 return f;
}

function cardOf(p){
 var c=document.createElement("div"); c.className="card";
 c.style.borderLeftColor=stcol(p.stato);
 c.innerHTML="<b>"+esc(p.nome)+"</b><p>"+esc(p.riga)+'</p><div class="meta">'+esc(p.categoria)+" · "+esc(nProg(p))+" · ultima traccia "+esc(p.ultima_traccia)+"</div>";
 c.onclick=function(){openP(p);};
 return c;
}

function bar(){
 var d=document.createElement("div"); d.className="bar";
 var s=document.createElement("input"); s.type="search"; s.placeholder="Cerca in tutte le schede"; s.value=flt.q;
 s.oninput=function(){flt.q=this.value;render();var n=document.querySelector(".bar input[type=search]");if(n)n.focus();};
 d.appendChild(s);
 var sel=document.createElement("select");
 sel.innerHTML='<option value="">Tutti i perimetri</option>'+D.perimetri.map(function(p){return '<option value="'+p.id+'"'+(flt.pe===p.id?" selected":"")+">"+esc(p.nome)+"</option>";}).join("");
 sel.onchange=function(){flt.pe=this.value;render();};
 d.appendChild(sel);
 if(flt.q||flt.st||flt.pe){
  var b=document.createElement("button"); b.className="x"; b.textContent="Azzera i filtri";
  b.onclick=function(){flt={q:"",st:null,pe:""};render();};
  d.appendChild(b);
 }
 return d;
}

function viewPractice(){
 var f=document.createDocumentFragment();
 f.appendChild(bar());
 var pr={};
 D.partner.forEach(function(p){ (p.practice&&p.practice.length?p.practice:["Senza practice"]).forEach(function(x){ (pr[x]=pr[x]||[]).push(p); }); });
 Object.keys(pr).sort().forEach(function(k){
  var list=pr[k].filter(match);
  if(!list.length)return;
  var g=document.createElement("div"); g.className="grp";
  g.innerHTML="<h2>"+esc(k)+"</h2><p class='n'>"+list.length+" soggetti</p>";
  var cols=document.createElement("div"); cols.className="cols";
  list.forEach(function(p){ cols.appendChild(cardOf(p)); });
  g.appendChild(cols); f.appendChild(g);
 });
 return f;
}

function viewSchede(){
 var f=document.createDocumentFragment();
 f.appendChild(bar());
 D.perimetri.forEach(function(pe){
  var list=D.partner.filter(function(p){return p.perimetro===pe.id&&match(p);});
  if(!list.length)return;
  var g=document.createElement("div"); g.className="grp";
  g.innerHTML="<h2>"+esc(pe.nome)+"</h2><p class='n'>"+esc(pe.nota)+"</p>";
  list.forEach(function(p){
   var d=document.createElement("details"); d.className="sch";
   d.innerHTML="<summary><strong>"+esc(p.nome)+'</strong><span class="pill st" style="background:'+stcol(p.stato)+'">'+esc(p.stato)+'</span><span class="pill">'+esc(p.categoria)+"</span></summary>";
   var b=document.createElement("div"); b.className="body"; b.innerHTML=schedaHtml(p);
   d.appendChild(b); g.appendChild(d);
  });
  f.appendChild(g);
 });
 return f;
}

function fld(t,v){ if(v==null||v===""||(Array.isArray(v)&&!v.length))return ""; 
 var body = Array.isArray(v) ? "<ul>"+v.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>" : esc(v);
 return '<dl class="f"><dt>'+t+"</dt><dd>"+body+"</dd></dl>";
}
function schedaHtml(p){
 var h="";
 h+=fld("Una riga",p.riga);
 h+=progHtml(p);
 h+=fld("Ragione sociale",p.ragione_sociale);
 h+=fld("Che cosa si scambiano",p.oggetto);
 h+=fld("Profilo",p.profilo);
 h+=fld("Documento contrattuale",p.documento);
 h+=fld("Condizioni economiche",p.economics);
 h+=fld("Clausole",p.clausole);
 h+=fld("Referenti",p.referenti);
 h+=fld("Prossimi passi",p.prossimi_passi);
 h+=fld("Rischi e punti aperti",p.rischi);
 if(p.legami&&p.legami.length) h+=fld("Legami",p.legami.map(function(l){return l.con+": "+l.perche;}));
 h+=fld("Practice",p.practice);
 h+=fld("Anche chiamato",p.alias);
 h+=fld("Tracce in archivio",p.prima_traccia+" - "+p.ultima_traccia);
 if(p.fonti&&p.fonti.length){
  h+='<dl class="f"><dt>Fonti in archivio ('+p.fonti.length+")</dt><dd>"+p.fonti.map(function(s){
   return '<div class="src"><span class="q">'+esc(s.q)+'</span><br><a class="reclink" href="index.html#rec='+encodeURIComponent(s.rec)+'&q='+encodeURIComponent(s.q)+'" target="_blank" rel="noopener" title="Apre il contenuto originale nell\'archivio"><code>'+esc(s.rec)+'</code> apri nell\'archivio</a></div>';
  }).join("")+"</dd></dl>";
 }
 return h;
}
function openP(p){
 document.getElementById("ph").textContent=p.nome;
 document.getElementById("pb").innerHTML='<p><span class="pill st" style="background:'+stcol(p.stato)+'">'+esc(p.stato)+'</span><span class="pill st" style="background:'+pcol(p.perimetro)+'">'+esc(perNome(p.perimetro))+'</span><span class="pill">'+esc(nProg(p))+"</span></p>"+schedaHtml(p);
 document.getElementById("panel").classList.add("on");
}

function viewSintesi(){
 var d=document.createElement("div"); d.className="prose";
 D.sintesi.forEach(function(s){
  var h=document.createElement("h2"); h.textContent=s.titolo; d.appendChild(h);
  var p=document.createElement("p"); p.textContent=s.testo; d.appendChild(p);
 });
 var h=document.createElement("h2"); h.textContent="Le scadenze prossime che nascono da queste partnership"; d.appendChild(h);
 var ul=document.createElement("ul");
 D.scadenze.forEach(function(s){var li=document.createElement("li");li.textContent=s;ul.appendChild(li);});
 d.appendChild(ul);
